# ride.yaml
# Personal ride configuration — defaults, bikes, weather tolerance, and supplies.
# Run `npm run generate` after editing to update the app.

defaults:
  avg_speed_mph: 15      # used to estimate ride duration
  distance_miles: 30     # pre-filled in the setup form
  sunset: "18:30"        # pre-filled when no weather data is fetched

bikes:
  caledonia:
    name: "Cervélo Caledonia-5"
    tire: "Vittoria Corsa Control TLR 28c"
    front_psi: "48–52"
    rear_psi: "52–56"

  r3:
    name: "Cervélo R3"
    tire: "700C x 23 (tubed)"
    front_psi: "68"
    rear_psi: "72"

  cx:
    name: "Open UP 700C (CX)"
    tire: "Donnelly PDX (F) / MXP (R) 700x33"
    front_psi: "22–23"
    rear_psi: "24–25"

  gravel:
    name: "Open UP 650B (Gravel)"
    tire: "Rene Herse 650Bx48 Juniper Ridge"
    front_psi: "16–18"
    rear_psi: "18–20"

  mtb:
    name: "Ibis Ripley MTB"
    tire: '29" x 2.4"'
    front_psi: "22–24"
    rear_psi: "24–26"
    fork:
      model: "RockShox Pike 29"
      travel: "140mm"
      psi: "52–57"
    shock:
      model: "RockShox Deluxe Select+"
      stroke: "52.5mm"
      psi: "140–150"

# Ride-go/no-go bands. Each level requires both below and/or above thresholds.
# Levels are checked in order: nope → rough → fair → (good if none match).
weather:
  temp:
    nope:  { below: 40, above: 95 }
    rough: { below: 50, above: 90 }
    fair:  { below: 60, above: 85 }
  wind:
    nope:  { above: 25 }
    rough: { above: 15 }
    fair:  { above: 10 }
  aqi:
    nope:  { above: 150 }
    rough: { above: 100 }
    fair:  { above: 50 }

# 1 bottle per hour of riding.
# Pack mix_bags_per_extra_hour Ziploc bag(s) per hour beyond bottle capacity.
supplies:
  bottles_on_bike: 2
  mix_bags_per_extra_hour: 1
