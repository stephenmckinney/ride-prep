name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          npm ci
          npm run generate
          mkdir -p _site
          cp index.html app.js styles.css sw.js manifest.json icon-192.png icon-512.png clothing-config.js _site/
          sed -i "s/__CACHE_VERSION__/${GITHUB_SHA::7}/" _site/sw.js

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
